name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with black
        run: black --check --target-version py310 src/ tests/

      - name: Sort imports with isort
        run: isort --check-only src/ tests/

      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=100 --ignore=E203,W503

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=drawio_validator --cov-report=term-missing --cov-report=xml

      - name: Validate example drawio files (hard gate)
        run: |
          draw-mcp-validate examples/*.drawio --mode standard --severity error

      - name: Check XML well-formedness of fixtures
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for f in Path('tests/fixtures').glob('*.drawio'):
              try:
                  ET.parse(f)
                  print(f'OK: {f}')
              except ET.ParseError as e:
                  print(f'FAIL: {f}: {e}')
                  exit(1)
          "

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          if ls scripts/*.sh 1>/dev/null 2>&1; then
            shellcheck scripts/*.sh
          fi

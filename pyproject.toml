[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drawio-validator"
version = "2.0.0"
description = "Strict validation rules for AI-generated draw.io XML"
readme = "README.md"
license = "MIT"
dependencies = ["pyyaml>=6.0"]
requires-python = ">=3.10"
keywords = ["draw.io", "drawio", "validation", "xml", "diagrams"]
authors = [
    { name = "ekusiadadus", email = "ekusiadadus@example.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "isort>=5.0",
    "flake8>=7.0",
]

[project.scripts]
draw-mcp-validate = "drawio_validator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drawio_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.coverage.run]
source = ["drawio_validator"]

[tool.coverage.report]
fail_under = 80
show_missing = true
